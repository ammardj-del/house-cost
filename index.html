<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>BuildCost Manager</title>
<meta name="theme-color" content="#1c2530">
<link rel="manifest" href="manifest.json">
<style>
:root{--ink:#1c2530;--amber:#e8a33d;--bg:#f6f4ef;--card:#fff;--line:#e3ded2;--muted:#8a8574;--green:#2f6b4f;--rust:#a5402c;--blue:#2b4c7e}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:#232323;font-family:"Segoe UI",Tahoma,Arial,sans-serif}button,input,select,textarea{font:inherit}button{cursor:pointer}.layout{display:flex;min-height:100vh}.sidebar{position:fixed;inset:0 0 0 auto;width:250px;background:var(--ink);color:white;z-index:5;display:flex;flex-direction:column}.brand{padding:18px;border-bottom:1px solid #ffffff1a;display:flex;gap:10px;align-items:center}.logo{background:var(--amber);color:var(--ink);font-weight:900;font-size:22px;border-radius:8px;width:36px;height:36px;display:grid;place-items:center}.nav{padding:10px 8px;flex:1}.nav button{display:block;width:100%;padding:11px 12px;border:0;border-radius:8px;background:none;color:#fffc;margin-bottom:3px;text-align:right}.nav button.active,.nav button:hover{background:var(--amber);color:var(--ink)}.sidebar small{padding:14px 16px;color:#ffffff66}.main{width:calc(100% - 250px);margin-right:250px}.topbar{display:none;background:white;border-bottom:1px solid var(--line);padding:12px 16px;justify-content:space-between;align-items:center}.content{max-width:1300px;margin:auto;padding:20px}.page-title{margin:0;color:var(--ink);font-size:22px}.sub{color:var(--muted);font-size:13px;margin:3px 0}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin:16px 0}.stat,.card{background:var(--card);border:1px solid var(--line);border-radius:10px}.stat{padding:14px}.stat label{font-size:11px;color:var(--muted);display:block}.stat strong{display:block;color:var(--ink);font-size:20px;margin-top:4px}.green{color:var(--green)!important}.red{color:var(--rust)!important}.blue{color:var(--blue)!important}.amber{color:#b4770f!important}.card{padding:16px;margin-top:14px}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:14px}.section-title{font-size:14px;margin:0 0 12px;color:var(--ink)}.btn{border:0;border-radius:8px;padding:9px 14px;font-weight:700;font-size:13px}.primary{background:var(--amber);color:var(--ink)}.dark{background:var(--ink);color:white}.ghost{background:transparent;color:#5a6b7a}.outline{background:white;border:1px solid #d8d2c2}.danger{background:#fff;color:var(--rust)}.toolbar{display:flex;gap:8px;align-items:end;justify-content:space-between;flex-wrap:wrap}.field label{display:block;font-size:12px;font-weight:700;color:#5a5540;margin-bottom:4px}.field input,.field select,.field textarea,.search{width:100%;padding:9px 10px;border:1px solid #d8d2c2;border-radius:8px;background:#fbfaf7}.field input:focus,.field select:focus{outline:2px solid #e8a33d80}.form-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}table{border-collapse:collapse;width:100%;min-width:760px;font-size:13px}th,td{text-align:right;padding:10px;border-bottom:1px solid #f3f1e9}th{font-size:11px;color:var(--muted)}.table-wrap{overflow:auto}.pill{display:inline-block;border-radius:99px;padding:3px 8px;font-size:11px;font-weight:700}.paid{background:#e5f1ea;color:var(--green)}.due{background:#fbeae6;color:var(--rust)}.empty{text-align:center;padding:40px;color:var(--muted)}.bar{height:11px;background:#f0ede4;border-radius:9px;overflow:hidden}.bar i{display:block;height:100%;background:var(--amber);border-radius:9px}.row{display:grid;grid-template-columns:140px 1fr 100px;gap:10px;align-items:center;padding:8px 0;border-bottom:1px solid #f3f1e9;font-size:13px}.modal-bg{position:fixed;inset:0;background:#0006;display:grid;place-items:center;padding:14px;z-index:10}.modal{background:#fbfaf7;width:min(680px,100%);max-height:90vh;overflow:auto;border-radius:12px}.modal-head{padding:14px 18px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between}.modal-body{padding:18px;display:grid;gap:12px}.modal-head button{background:none;border:0;font-size:22px;color:var(--muted)}.actions{display:flex;justify-content:flex-start;gap:8px}.list-item{display:flex;justify-content:space-between;align-items:center;padding:9px 0;border-bottom:1px solid #f3f1e9}.progress{height:10px;background:#f0ede4;border-radius:99px;overflow:hidden}.progress i{display:block;height:100%;background:var(--amber)}
@media(max-width:900px){.sidebar{transform:translateX(100%);transition:.2s}.sidebar.open{transform:translateX(0)}.main{width:100%;margin:0}.topbar{display:flex}.stats{grid-template-columns:repeat(2,1fr)}.content{padding:16px}}@media(max-width:560px){.grid,.form-grid{grid-template-columns:1fr}.row{grid-template-columns:1fr}.stats{gap:8px}.stat{padding:11px}.stat strong{font-size:16px}}
</style>
</head>
<body>
<div class="layout"><aside class="sidebar" id="sidebar"><div class="brand"><div class="logo">B</div><div><b>BuildCost Manager</b><small style="display:block;padding:0">نسخة محلية</small></div></div><nav class="nav" id="nav"></nav><small>بياناتك محفوظة على جهازك فقط</small></aside><main class="main"><header class="topbar"><button class="btn ghost" id="menu">☰</button><b id="mobileTitle"></b><span></span></header><section class="content" id="content"></section></main></div><div id="modal"></div>
<script>
const KEY="buildcost_manager_local_v1";
const cats=["مواد البناء","الكهرباء","المياه والسباكة","الأبواب والنوافذ","التشطيبات","النقل والخدمات","الأدوات والمعدات","العمالة"];
const nav=[['dashboard','لوحة التحكم'],['expenses','المصروفات والمشتريات'],['workers','العمال'],['budget','الميزانية'],['reports','التقارير والإحصائيات'],['backup','النسخ الاحتياطي']];
const today=()=>new Date().toISOString().slice(0,10), id=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7), money=n=>(Number(n)||0).toLocaleString('ar-DZ')+' دج';
const esc=s=>String(s??'').replace(/[&<>"']/g,x=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[x]));
let db=(()=>{try{return JSON.parse(localStorage.getItem(KEY))||null}catch(e){return null}})()||{expenses:[],workers:[],logs:[],budget:0};let state={tab:'dashboard',worker:null};
function save(){localStorage.setItem(KEY,JSON.stringify(db))}function expenses(){return db.expenses.map(x=>({...x,paid:(x.payments||[]).reduce((a,p)=>a+Number(p.amount),0)}))}function totals(){let e=expenses(),l=db.logs;let cost=e.reduce((a,x)=>a+Number(x.total),0)+l.reduce((a,x)=>a+Number(x.amount),0),paid=e.reduce((a,x)=>a+x.paid,0)+l.reduce((a,x)=>a+Number(x.paid||0),0);return{cost,paid,due:cost-paid}}
function layout(){document.getElementById('nav').innerHTML=nav.map(x=>`<button class="${state.tab===x[0]?'active':''}" data-tab="${x[0]}">${x[1]}</button>`).join('');document.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>{state.tab=b.dataset.tab;state.worker=null;document.getElementById('sidebar').classList.remove('open');render()});document.getElementById('mobileTitle').textContent=nav.find(x=>x[0]===state.tab)[1]}
function render(){layout();({dashboard:dashboard,expenses:expensePage,workers:workerPage,budget:budgetPage,reports:reportsPage,backup:backupPage}[state.tab])()}
function dashboard(){let t=totals(),e=expenses();document.getElementById('content').innerHTML=`<h1 class="page-title">لوحة التحكم</h1><p class="sub">نظرة فورية على حالة تكلفة المشروع</p><div class="stats"><div class="stat"><label>إجمالي تكلفة المشروع</label><strong>${money(t.cost)}</strong></div><div class="stat"><label>إجمالي المدفوع</label><strong class="green">${money(t.paid)}</strong></div><div class="stat"><label>إجمالي المستحق</label><strong class="red">${money(t.due)}</strong></div><div class="stat"><label>المتبقي من الميزانية</label><strong class="blue">${db.budget?money(db.budget-t.cost):'—'}</strong></div></div><div class="grid"><div class="card"><h3 class="section-title">استهلاك الميزانية</h3>${db.budget?`<div class="progress"><i style="width:${Math.min(100,t.cost/db.budget*100)}%"></i></div><p class="sub">${(t.cost/db.budget*100).toFixed(1)}% من ${money(db.budget)}</p>`:'<div class="empty">لم تُحدد ميزانية بعد</div>'}</div><div class="card"><h3 class="section-title">آخر العمليات</h3>${e.slice(-5).reverse().map(x=>`<div class="list-item"><span>${esc(x.item)}</span><b>${money(x.total)}</b></div>`).join('')||'<div class="empty">لم تُسجل أي عملية بعد</div>'}</div></div>`}
function expensePage(){let e=expenses().reverse();document.getElementById('content').innerHTML=`<div class="toolbar"><div><h1 class="page-title">المصروفات والمشتريات</h1><p class="sub">${db.expenses.length} عملية مسجلة</p></div><button class="btn primary" id="addExpense">+ عملية جديدة</button></div><div class="card table-wrap"><table><thead><tr><th>التاريخ</th><th>البند</th><th>التصنيف</th><th>الإجمالي</th><th>المدفوع</th><th>المستحق</th><th></th></tr></thead><tbody>${e.map(x=>{let due=x.total-x.paid;return`<tr><td>${x.date}</td><td><b>${esc(x.item)}</b></td><td>${esc(x.category)}</td><td>${money(x.total)}</td><td class="green">${money(x.paid)}</td><td class="red">${money(due)}</td><td>${due>0?`<button class="btn outline" data-pay="${x.id}">دفعة</button>`:''}<button class="btn danger" data-del="${x.id}">🗑</button></td></tr>`}).join('')||'<tr><td colspan="7" class="empty">لا توجد عمليات بعد</td></tr>'}</tbody></table></div>`;document.getElementById('addExpense').onclick=()=>expenseModal();document.querySelectorAll('[data-del]').forEach(b=>b.onclick=()=>{if(confirm('حذف هذه العملية؟')){db.expenses=db.expenses.filter(x=>x.id!==b.dataset.del);save();expensePage()}});document.querySelectorAll('[data-pay]').forEach(b=>b.onclick=()=>payment(b.dataset.pay))}
function expenseModal(){show('تسجيل عملية جديدة',`<div class="form-grid"><div class="field"><label>اسم المادة / الخدمة *</label><input id="item"></div><div class="field"><label>التاريخ</label><input type="date" id="date" value="${today()}"></div><div class="field"><label>التصنيف</label><select id="category">${cats.map(x=>`<option>${x}</option>`).join('')}</select></div><div class="field"><label>الكمية</label><input type="number" id="qty" value="1"></div><div class="field"><label>سعر الوحدة (دج)</label><input type="number" id="price" value="0"></div><div class="field"><label>المدفوع الآن</label><input type="number" id="initial" value="0"></div></div><div class="actions"><button class="btn ghost" data-close>إلغاء</button><button class="btn primary" id="saveExpense">حفظ</button></div>`);document.getElementById('saveExpense').onclick=()=>{let item=document.getElementById('item').value.trim(),total=Number(document.getElementById('qty').value)*Number(document.getElementById('price').value),paid=Number(document.getElementById('initial').value);if(!item)return alert('أدخل اسم المادة');db.expenses.push({id:id(),item,date:document.getElementById('date').value,category:document.getElementById('category').value,total,payments:paid?[{amount:paid,date:today()}]:[]});save();close();expensePage()}}
function payment(expId){show('إضافة دفعة',`<div class="field"><label>المبلغ</label><input type="number" id="amount"></div><div class="actions"><button class="btn ghost" data-close>إلغاء</button><button class="btn primary" id="savePayment">تسجيل</button></div>`);document.getElementById('savePayment').onclick=()=>{let amount=Number(document.getElementById('amount').value);if(amount>0){let x=db.expenses.find(x=>x.id===expId);x.payments.push({amount,date:today()});save();close();expensePage()}}}
function workerPage(){if(state.worker)return workerDetail();document.getElementById('content').innerHTML=`<div class="toolbar"><div><h1 class="page-title">العمال</h1><p class="sub">${db.workers.length} عامل مسجل</p></div><button class="btn primary" id="addWorker">+ عامل جديد</button></div><div class="grid">${db.workers.map(w=>`<div class="card"><div class="toolbar"><b>${esc(w.name)}</b><button class="btn danger" data-wdel="${w.id}">🗑</button></div><p class="sub">${esc(w.job||'')}</p><button class="btn outline" data-worker="${w.id}">عرض السجلات</button></div>`).join('')||'<div class="empty">لم يضف أي عامل بعد</div>'}</div>`;document.getElementById('addWorker').onclick=workerModal;document.querySelectorAll('[data-worker]').forEach(b=>b.onclick=()=>{state.worker=b.dataset.worker;render()});document.querySelectorAll('[data-wdel]').forEach(b=>b.onclick=()=>{db.workers=db.workers.filter(x=>x.id!==b.dataset.wdel);db.logs=db.logs.filter(x=>x.worker!==b.dataset.wdel);save();workerPage()})}
function workerModal(){show('إضافة عامل',`<div class="form-grid"><div class="field"><label>الاسم *</label><input id="wname"></div><div class="field"><label>المهنة</label><input id="wjob"></div><div class="field"><label>الأجر اليومي</label><input type="number" id="wage" value="0"></div></div><div class="actions"><button class="btn ghost" data-close>إلغاء</button><button class="btn primary" id="saveWorker">حفظ</button></div>`);document.getElementById('saveWorker').onclick=()=>{let name=document.getElementById('wname').value.trim();if(!name)return;db.workers.push({id:id(),name,job:document.getElementById('wjob').value,wage:Number(document.getElementById('wage').value)});save();close();workerPage()}}
function workerDetail(){let w=db.workers.find(x=>x.id===state.worker),logs=db.logs.filter(x=>x.worker===w.id);document.getElementById('content').innerHTML=`<button class="btn ghost" id="back">→ رجوع</button><div class="toolbar"><div><h1 class="page-title">${esc(w.name)}</h1><p class="sub">${esc(w.job||'')}</p></div><button class="btn primary" id="addLog">+ تسجيل عمل</button></div><div class="card table-wrap"><table><thead><tr><th>التاريخ</th><th>المهمة</th><th>المستحق</th><th>المدفوع</th><th></th></tr></thead><tbody>${logs.map(x=>`<tr><td>${x.date}</td><td>${esc(x.task)}</td><td>${money(x.amount)}</td><td>${money(x.paid||0)}</td><td><button class="btn danger" data-ldel="${x.id}">🗑</button></td></tr>`).join('')||'<tr><td colspan="5" class="empty">لا توجد سجلات</td></tr>'}</tbody></table></div>`;document.getElementById('back').onclick=()=>{state.worker=null;render()};document.getElementById('addLog').onclick=()=>logModal(w);document.querySelectorAll('[data-ldel]').forEach(b=>b.onclick=()=>{db.logs=db.logs.filter(x=>x.id!==b.dataset.ldel);save();workerDetail()})}
function logModal(w){show('تسجيل عمل',`<div class="form-grid"><div class="field"><label>المهمة *</label><input id="task"></div><div class="field"><label>التاريخ</label><input type="date" id="ldate" value="${today()}"></div><div class="field"><label>المبلغ المستحق</label><input type="number" id="lamount" value="${w.wage||0}"></div></div><div class="actions"><button class="btn ghost" data-close>إلغاء</button><button class="btn primary" id="saveLog">حفظ</button></div>`);document.getElementById('saveLog').onclick=()=>{let task=document.getElementById('task').value.trim();if(!task)return;db.logs.push({id:id(),worker:w.id,task,date:document.getElementById('ldate').value,amount:Number(document.getElementById('lamount').value),paid:0});save();close();workerDetail()}}
function budgetPage(){let t=totals();document.getElementById('content').innerHTML=`<h1 class="page-title">الميزانية</h1><p class="sub">حدد ميزانية المشروع وراقب استهلاكها</p><div class="card"><div class="form-grid"><div class="field"><label>الميزانية الإجمالية (دج)</label><input type="number" id="budget" value="${db.budget||0}"></div></div><br><button class="btn primary" id="saveBudget">حفظ</button>${db.budget?`<p>التكلفة الحالية: <b>${money(t.cost)}</b></p><div class="progress"><i style="width:${Math.min(100,t.cost/db.budget*100)}%"></i></div>`:''}</div>`;document.getElementById('saveBudget').onclick=()=>{db.budget=Number(document.getElementById('budget').value);save();budgetPage()}}
function reportsPage(){let t=totals();document.getElementById('content').innerHTML=`<h1 class="page-title">التقارير والإحصائيات</h1><p class="sub">ملخص بيانات المشروع</p><div class="stats"><div class="stat"><label>عدد المشتريات</label><strong>${db.expenses.length}</strong></div><div class="stat"><label>عدد العمال</label><strong>${db.workers.length}</strong></div><div class="stat"><label>إجمالي المدفوع</label><strong class="green">${money(t.paid)}</strong></div><div class="stat"><label>إجمالي المستحق</label><strong class="red">${money(t.due)}</strong></div></div><div class="card"><h3 class="section-title">إجمالي المشروع</h3><p>التكلفة المسجلة حتى الآن: <b>${money(t.cost)}</b></p></div>`}
function backupPage(){document.getElementById('content').innerHTML=`<h1 class="page-title">النسخ الاحتياطي</h1><p class="sub">صدّر بياناتك أو استعد نسخة سابقة</p><div class="card"><button class="btn primary" id="export">تنزيل نسخة احتياطية (JSON)</button></div><div class="card"><label class="btn outline">اختيار ملف<input type="file" id="import" accept="application/json" hidden></label><p class="sub">استعادة النسخة تستبدل البيانات الحالية.</p></div>`;document.getElementById('export').onclick=()=>{let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(db,null,2)],{type:'application/json'}));a.download='buildcost-backup-'+today()+'.json';a.click()};document.getElementById('import').onchange=e=>{let r=new FileReader();r.onload=()=>{try{db=JSON.parse(r.result);save();render();alert('تمت استعادة البيانات')}catch(x){alert('الملف غير صالح')}};r.readAsText(e.target.files[0])}}
function show(title,body){document.getElementById('modal').innerHTML=`<div class="modal-bg"><div class="modal"><div class="modal-head"><b>${title}</b><button data-close>×</button></div><div class="modal-body">${body}</div></div></div>`;document.querySelectorAll('[data-close]').forEach(x=>x.onclick=close)}function close(){document.getElementById('modal').innerHTML=''}document.getElementById('menu').onclick=()=>document.getElementById('sidebar').classList.toggle('open');if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js');render();
</script>
</body>
</html>
